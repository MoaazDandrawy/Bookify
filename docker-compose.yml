version: '3.4'

services:
  bookify.api:
    image: ${DOCKER_REGISTRY-}bookifyapi
    container_name: Bookify.Api
    build:
      context: .
      dockerfile: Bookify.Api/Dockerfile
    environment:
    - ASPNETCORE_URLS=http://0.0.0.0:8080
    depends_on:
      - bookify-db
    ports:
        - "9500:8080"

    # restart: on-failure

  bookify-db:
      image: postgres:latest
      container_name: Bookify.Db
      environment:
        - POSTGRES_DB=bookify
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - PGDATA=/var/lib/postgresql/data/pgdata
      volumes:
        - ./.containers/database:/var/lib/postgresql/data/pgdata
      ports:
        - 5432:5432
        
  bookify-idp:
    image: quay.io/keycloak/keycloak:latest
    container_name: Bookify.Identity
    #el realm da bi manage collection of users.
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      # - ./.containers/identity:/opt/keycloak/data
      - ./.files/bookify-realm-export.json:/opt/keycloak/data/import/realm.json
    ports:
      - 18080:8080